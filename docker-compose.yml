services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener
      DB_USER: url_shortener
      DB_PASSWORD: url_shortener
    depends_on:
      postgres:
        condition: service_healthy
